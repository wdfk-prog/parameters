name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      rtthread_ref:
        description: RT-Thread git ref used by the package integration build; use default for remote HEAD
        required: false
        default: default
      bsp_path:
        description: RT-Thread BSP path used as the integration build host
        required: false
        default: bsp/qemu-vexpress-a9

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: autogen_parameter_manager
  RTTHREAD_REF: ${{ github.event.inputs.rtthread_ref || 'default' }}
  BSP_PATH: ${{ github.event.inputs.bsp_path || 'bsp/qemu-vexpress-a9' }}
  RTTHREAD_SOURCE_CACHE_VERSION: v1
  ARM_GCC_DIR: /opt/gcc-arm-none-eabi
  ARM_GCC_VERSION: 13.3.rel1
  ARM_GCC_SHA256: 95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4
  ARM_GCC_CACHE_VERSION: v2
  RTT_CC: gcc
  RTT_EXEC_PATH: /opt/gcc-arm-none-eabi/bin

jobs:
  generator-tests:
    name: Parameter generator tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generator tests
        run: python3 -m unittest discover -s parameters/tests -p 'test_*.py'

  host-runtime-tests:
    name: Host runtime tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host runtime tests in parallel
        shell: bash
        env:
          PAR_HOST_TEST_GROUP: mandatory
        run: bash .github/ci/host-tests.sh

  config-profile-matrix:
    name: Configuration profile matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CI configuration profiles
        shell: bash
        run: bash .github/ci/config-matrix.sh

  host-runtime-current-policy-tests:
    name: Host runtime current-policy tests
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run current-policy host tests in parallel
        shell: bash
        env:
          PAR_HOST_TEST_GROUP: current-policy
          PAR_HOST_REQUIRE_SELECTED: 1
        run: bash .github/ci/host-tests.sh

  host-cppcheck-src:
    name: host-cppcheck-src
    runs-on: ubuntu-latest
    env:
      CPPCHECK_MODE: ${{ ((github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master')) || (github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master'))) && 'deep' || 'fast' }}
      CPPCHECK_SHARD: source
      CPPCHECK_REPORT: cppcheck-source.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 10m sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            cppcheck

      - name: Run source cppcheck shard
        shell: bash
        run: bash .github/ci/cppcheck.sh

      - name: Upload source cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-cppcheck-source
          path: cppcheck-source.txt
          if-no-files-found: error

  host-cppcheck-host-tests:
    name: host-cppcheck-host-tests
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master')) || (github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
    env:
      CPPCHECK_MODE: deep
      CPPCHECK_SHARD: host-tests
      CPPCHECK_REPORT: cppcheck-host-tests.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 10m sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            cppcheck

      - name: Run host-test cppcheck shard
        shell: bash
        run: bash .github/ci/cppcheck.sh

      - name: Upload host-test cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-cppcheck-host-tests
          path: cppcheck-host-tests.txt
          if-no-files-found: error

  documentation:
    name: Doxygen documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 10m sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            doxygen graphviz

      - name: Build Doxygen site
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/doxygen
          awk '
            BEGIN { seen = 0 }
            /^[[:space:]]*WARN_AS_ERROR[[:space:]]*=/ {
              if (!seen) { print "WARN_AS_ERROR = NO"; seen = 1 }
              next
            }
            { print }
            END { if (!seen) print "WARN_AS_ERROR = NO" }
          ' Doxyfile > build/doxygen/Doxyfile.ci
          doxygen build/doxygen/Doxyfile.ci 2>&1 | tee doxygen.log
          test -d build/doxygen/html
          touch build/doxygen/html/.nojekyll

      - name: Upload Doxygen log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-log
          path: doxygen.log
          if-no-files-found: error

      - name: Upload Doxygen HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/doxygen/html
          if-no-files-found: warn

  rtthread-package-compile:
    name: RT-Thread package compile profiles
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve RT-Thread source revision
        id: resolve-rtthread
        shell: bash
        run: |
          set -euo pipefail
          remote_url="https://github.com/RT-Thread/rt-thread.git"
          resolved_ref="$RTTHREAD_REF"
          if [ -z "$resolved_ref" ] || [ "$resolved_ref" = "default" ] || [ "$resolved_ref" = "HEAD" ]; then
            resolved_ref="$(git ls-remote --symref "$remote_url" HEAD | \
              awk '$1 == "ref:" { sub("refs/heads/", "", $2); print $2; exit }')"
            if [ -z "$resolved_ref" ]; then
              echo "Unable to resolve RT-Thread default branch from $remote_url" >&2
              exit 1
            fi
          fi
          sha="$(git ls-remote "$remote_url" "refs/heads/$resolved_ref" | awk 'NR == 1 { print $1 }')"
          if [ -z "$sha" ]; then
            sha="$(git ls-remote "$remote_url" "refs/tags/$resolved_ref^{}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -z "$sha" ]; then
            sha="$(git ls-remote "$remote_url" "refs/tags/$resolved_ref" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -z "$sha" ]; then
            sha="$resolved_ref"
          fi
          case "$sha" in
            [0-9a-fA-F][0-9a-fA-F]*) ;;
            *)
              echo "Unable to resolve RTTHREAD_REF to a cacheable revision: $RTTHREAD_REF" >&2
              exit 1
              ;;
          esac
          if [ "${#sha}" -lt 7 ]; then
            echo "Resolved RTTHREAD_REF is too short for a safe cache key: $sha" >&2
            exit 1
          fi
          echo "RTTHREAD_RESOLVED_REF=$resolved_ref" >> "$GITHUB_ENV"
          echo "RTTHREAD_RESOLVED_SHA=$sha" >> "$GITHUB_ENV"
          echo "rtthread-cache-id=$sha" >> "$GITHUB_OUTPUT"
          echo "RTTHREAD_SOURCE_REVISION ref=$RTTHREAD_REF resolved_ref=$resolved_ref sha=$sha"

      - name: Restore RT-Thread source cache
        id: cache-rtthread-source
        uses: actions/cache@v4
        with:
          path: _ci/rt-thread-source-cache/${{ steps.resolve-rtthread.outputs.rtthread-cache-id }}
          key: ${{ runner.os }}-rtthread-source-${{ steps.resolve-rtthread.outputs.rtthread-cache-id }}-${{ env.RTTHREAD_SOURCE_CACHE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt

      - name: Install RT-Thread Python dependencies
        run: |
          python3 -m pip install --user -r .github/ci/requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import SCons
          print("SCons version:", SCons.__version__)
          assert SCons.__version__ == "4.10.1", SCons.__version__
          PY

      - name: Prepare reusable RT-Thread source tree
        id: prepare-rtthread
        shell: bash
        env:
          RTTHREAD_SOURCE_CACHE_DIR: _ci/rt-thread-source-cache/${{ steps.resolve-rtthread.outputs.rtthread-cache-id }}
        run: bash .github/ci/prepare-rtthread-source.sh

      - name: Prepare toolchain cache directory
        run: |
          sudo mkdir -p "$ARM_GCC_DIR"
          sudo chown -R "$USER:$(id -gn)" "$ARM_GCC_DIR"

      - name: Restore ARM GCC cache
        id: cache-arm-gcc
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_GCC_DIR }}
          key: ${{ runner.os }}-arm-gcc-${{ env.ARM_GCC_VERSION }}-${{ env.ARM_GCC_CACHE_VERSION }}

      - name: Install ARM GCC if cache restore missed
        if: steps.cache-arm-gcc.outputs.cache-hit != 'true'
        timeout-minutes: 25
        shell: bash
        run: bash .github/ci/install-arm-gcc.sh

      - name: Export toolchain path
        run: |
          echo "$ARM_GCC_DIR/bin" >> "$GITHUB_PATH"
          echo "RTT_EXEC_PATH=$ARM_GCC_DIR/bin" >> "$GITHUB_ENV"
          "$ARM_GCC_DIR/bin/arm-none-eabi-gcc" --version

      - name: Build package profiles in parallel
        shell: bash
        env:
          AUTOGEN_PM_CI_AT24CXX_REPO: https://github.com/XiaojieFan/at24cxx.git
          AUTOGEN_PM_CI_PROFILE_PARALLEL: '2'
          AUTOGEN_PM_CI_SCONS_JOBS: '2'
          RTTHREAD_SOURCE_TAR: _ci/rt-thread-source/rt-thread-source.tar
          RTTHREAD_SOURCE_SHA_FILE: _ci/rt-thread-source/rt-thread-source.sha
        run: bash .github/ci/rtthread-package-compile-all.sh

      - name: Upload RT-Thread compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtthread-package-compile-logs
          path: |
            _ci/logs/rtthread-package-compile-*.log
            _ci/logs/rtthread-package-compile-*.console.log
            _ci/rt-thread-source/prepare-rtthread-source.log
          if-no-files-found: warn
